    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; border: 1px solid #c3e6cb; }

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T4NLRS4Q"

    <h1>🧪 Test Planning Date Calculations</h1>
    <p>This test verifies that the planning functionality gives correct dates without off-by-one errors.</p>
    
    <div id="test-results"></div>
    
    <script src="script.js"></script>
    <script>
        // Initialize test environment
        trips = []; // Start with empty trips
        
        function runTests() {
            const results = [];
            
            // Test 1: Check if getTodayLocal() works correctly
            const today = getTodayLocal();
            results.push({
                name: "getTodayLocal() returns valid date",
                pass: today instanceof Date && !isNaN(today.getTime()),
                details: `Today: ${today.toISOString().split('T')[0]}`
            });
            
            // Test 2: Test findSafeTravelWindows with empty trips
            const testDays = 7;
            const windows = schengenEngine.findSafeTravelWindows(testDays, today, []);
            results.push({
                name: "findSafeTravelWindows returns windows",
                pass: windows.length > 0,
                details: `Found ${windows.length} windows for ${testDays} days`
            });
            
            if (windows.length > 0) {
                const firstWindow = windows[0];
                
                // Test 3: Check if start date is not behind today
                const startDateStr = dateToISOString(firstWindow.startDate);
                const todayStr = dateToISOString(today);
                const startNotBehind = startDateStr >= todayStr;
                results.push({
                    name: "Start date not behind today",
                    pass: startNotBehind,
                    details: `Today: ${todayStr}, Start: ${startDateStr}`
                });
                
                // Test 4: Calculate expected end date
                const expectedEndDate = new Date(firstWindow.startDate);
                expectedEndDate.setDate(expectedEndDate.getDate() + testDays - 1);
                const expectedEndStr = dateToISOString(expectedEndDate);
                const actualEndStr = dateToISOString(firstWindow.endDate);
                results.push({
                    name: "End date calculation correct",
                    pass: expectedEndStr === actualEndStr,
                    details: `Expected: ${expectedEndStr}, Actual: ${actualEndStr}`
                });
                
                // Test 5: Verify duration is correct
                const actualDuration = calculateStayDuration(startDateStr, actualEndStr);
                results.push({
                    name: "Duration calculation correct",
                    pass: actualDuration === testDays,
                    details: `Expected: ${testDays} days, Actual: ${actualDuration} days`
                });
            }
            
            // Test 6: Test with a specific future date
            const futureDate = new Date(today);
            futureDate.setDate(futureDate.getDate() + 30);
            const futureWindows = schengenEngine.findSafeTravelWindows(14, futureDate, []);
            
            if (futureWindows.length > 0) {
                const futureWindow = futureWindows[0];
                const futureDateStr = dateToISOString(futureDate);
                const futureStartStr = dateToISOString(futureWindow.startDate);
                
                results.push({
                    name: "Future date search works",
                    pass: futureStartStr >= futureDateStr,
                    details: `Search from: ${futureDateStr}, Found: ${futureStartStr}`
                });
            }
            
            // Test 7: Test timezone consistency
            const testDate = new Date(2024, 5, 15); // June 15, 2024
            const isoString = dateToISOString(testDate);
            const parsedBack = parseISODateLocal(isoString);
            const roundTrip = dateToISOString(parsedBack);
            
            results.push({
                name: "Timezone round-trip consistency",
                pass: isoString === roundTrip,
                details: `Original: ${isoString}, Round-trip: ${roundTrip}`
            });
            
            // Display results
            displayResults(results);
        }
        
        function displayResults(results) {
            const container = document.getElementById('test-results');
            let html = '<h2>Test Results</h2>';
            
            let passCount = 0;
            let totalCount = results.length;
            
            results.forEach(result => {
                const className = result.pass ? 'pass' : 'fail';
                const status = result.pass ? '✅ PASS' : '❌ FAIL';
                if (result.pass) passCount++;
                
                html += `
                    <div class="test-result ${className}">
                        <strong>${status}</strong> ${result.name}<br>
                        <small>${result.details}</small>
                    </div>
                `;
            });
            
            html += `<div class="test-result ${passCount === totalCount ? 'pass' : 'warning'}">
                <strong>Summary:</strong> ${passCount}/${totalCount} tests passed
            </div>`;
            
            container.innerHTML = html;
        }
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
